<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVW Player</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
        body { margin: 0; background: #0d0d1a; overflow: hidden; }
        canvas { display: block; }
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: white; font-family: sans-serif;
            cursor: pointer; z-index: 10;
        }
        #overlay h1 { margin-bottom: 0.25em; }
        #overlay .artist { color: #aaa; margin-bottom: 1.5em; }
        #overlay .start-hint { color: #888; font-size: 0.9em; }
        #info {
            position: fixed; top: 10px; left: 10px; color: #aaa;
            font-family: monospace; font-size: 12px; z-index: 5;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="overlay">
        <h1 id="album-title">Loading...</h1>
        <p id="album-artist" class="artist"></p>
        <p class="start-hint">Click anywhere to start</p>
    </div>
    <div id="info"></div>
</body>
</html>
