<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVW Player</title>
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a14; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; }

        /* Page layout: header + canvas + foldout fill viewport */
        #page { display: flex; flex-direction: column; height: 100vh; }

        /* Album header */
        #album-header {
            flex-shrink: 0;
            padding: 0.75rem 1.5rem;
            background: #0d0d1a;
            border-bottom: 1px solid #1a1a2e;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 5;
        }
        #album-header .album-text { min-width: 0; }
        #album-header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        #album-header .artist {
            margin: 0.15rem 0 0;
            font-size: 0.85rem;
            color: #888;
        }
        #album-header .description {
            margin: 0.15rem 0 0;
            font-size: 0.75rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Album detail panel — drops down from header over canvas */
        #album-detail {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: transparent;
            border-bottom: none;
            opacity: 0;
            transform: translateY(-100%);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 3;
            max-height: 60%;
            overflow-y: auto;
        }
        #album-detail.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #album-detail-inner {
            padding: 1rem 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        #album-detail .album-cover {
            width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }
        #album-detail .album-detail-text { min-width: 0; }
        #album-detail .album-full-description {
            margin: 0;
            font-size: 0.85rem;
            color: #bbb;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        #album-detail .album-detail-links {
            margin: 0.75rem 0 0;
            padding: 0;
            list-style: none;
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
        }
        #album-detail .album-detail-links a {
            color: #6688cc;
            text-decoration: none;
            pointer-events: auto;
        }
        #album-detail .album-detail-links a:hover { text-decoration: underline; }

        /* Track artwork */
        .track-artwork {
            width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }
        #track-info-inner {
            padding: 0.5rem 1.5rem;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }
        #track-info-text { min-width: 0; }

        /* Canvas container */
        #canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a14;
            overflow: hidden;
            position: relative;
        }
        canvas { display: block; max-width: 100%; max-height: 100%; position: relative; z-index: 1; outline: none; }
        canvas:focus { box-shadow: inset 0 0 0 2px rgba(100,130,200,0.5); }

        /* Dim overlay when canvas is not focused */
        #canvas-container::after {
            content: '\2190  \2191  \2193  \2192';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
            color: rgba(255,255,255,0.5);
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #canvas-container:focus-within::after {
            opacity: 0;
        }

        /* Track info bar — overlays bottom of canvas, no layout shift */
        #track-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 13, 26, 0.9);
            border-top: 1px solid #1a1a2e;
            opacity: 0;
            transform: translateY(100%);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }
        #track-info.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #track-info .track-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        #track-info .track-artist {
            margin: 0.2rem 0 0;
            font-size: 0.85rem;
            color: #888;
        }
        #track-info .track-description {
            margin: 0.5rem 0 0;
            font-size: 0.8rem;
            color: #aaa;
            line-height: 1.4;
        }
        #track-info .track-links {
            margin: 0.5rem 0 0;
            padding: 0;
            list-style: none;
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
        }
        #track-info .track-links a {
            color: #6688cc;
            text-decoration: none;
        }
        #track-info .track-links a { pointer-events: auto; }
        #track-info .track-links a:hover { text-decoration: underline; }
        /* Hidden container for track metadata injected by WASM */
        #track-data { display: none; }

        /* Click-to-start overlay */
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: white;
            cursor: pointer; z-index: 10;
        }
        #overlay h1 { margin-bottom: 0.25em; font-size: 2rem; }
        #overlay .artist { color: #aaa; margin-bottom: 1.5em; font-size: 1.1rem; }
        #overlay .start-hint { color: #888; font-size: 0.9em; }
    </style>
</head>
<body>
    <div id="page">
        <header id="album-header" style="display: none;">
            <div class="album-text">
                <h1 id="header-title"><span id="header-title-text"></span> <span id="header-chevron" style="font-size:0.7em; color:#666;">&#9662;</span></h1>
                <p id="header-artist" class="artist"></p>
                <p id="header-description" class="description"></p>
            </div>
            <span id="header-build" style="margin-left:auto; font-size:0.65rem; color:#444; white-space:nowrap;"></span>
        </header>

        <div id="canvas-container">
            <canvas id="game-canvas" tabindex="0"></canvas>
            <div id="album-detail">
                <div id="album-detail-inner">
                    <img id="album-cover-img" class="album-cover" style="display:none;" alt="Album cover" />
                    <div class="album-detail-text">
                        <p class="album-full-description" id="album-full-description"></p>
                        <ul class="album-detail-links" id="album-detail-links"></ul>
                    </div>
                </div>
            </div>
            <div id="track-info">
                <div id="track-info-inner">
                    <img id="track-artwork-img" class="track-artwork" style="display:none;" alt="Track artwork" />
                    <div id="track-info-text">
                        <h3 class="track-title" id="track-info-title"><span id="track-title-text"></span> <span id="track-chevron" style="font-size:0.7em; color:#666;">&#9662;</span></h3>
                        <p class="track-artist" id="track-info-artist"></p>
                        <p class="track-description" id="track-info-description"></p>
                        <ul class="track-links" id="track-info-links"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Album metadata injected by WASM at startup -->
    <div id="album-data" style="display:none;"></div>
    <!-- Track metadata injected by WASM at startup -->
    <div id="track-data"></div>

    <div id="overlay">
        <h1 id="album-title">Loading...</h1>
        <p id="album-artist" class="artist"></p>
        <p class="start-hint">Click anywhere to start</p>
    </div>

    <script>
        (function() {
            // --- Album detail panel ---
            var albumPanel = document.getElementById('album-detail');
            var headerTitle = document.getElementById('header-title');

            function populateAlbumPanel() {
                var data = document.getElementById('album-data');
                if (!data) return;

                var desc = data.getAttribute('data-description') || '';
                var coverUrl = data.getAttribute('data-cover-art-url') || '';
                var links = data.getAttribute('data-links') || '';

                var descEl = document.getElementById('album-full-description');
                descEl.textContent = desc;
                descEl.style.display = desc ? '' : 'none';

                var coverImg = document.getElementById('album-cover-img');
                if (coverUrl) {
                    coverImg.src = coverUrl;
                    coverImg.style.display = '';
                } else {
                    coverImg.style.display = 'none';
                }

                var linksEl = document.getElementById('album-detail-links');
                linksEl.innerHTML = '';
                if (links) {
                    try {
                        JSON.parse(links).forEach(function(pair) {
                            if (!Array.isArray(pair) || pair.length < 2) return;
                            var url = pair[1];
                            if (!/^https?:\/\//i.test(url)) return;
                            var li = document.createElement('li');
                            var a = document.createElement('a');
                            a.textContent = pair[0];
                            a.href = url;
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                            li.appendChild(a);
                            linksEl.appendChild(li);
                        });
                    } catch (e) { /* ignore malformed JSON */ }
                }
                linksEl.style.display = linksEl.children.length ? '' : 'none';
            }

            var headerChevron = document.getElementById('header-chevron');
            if (headerTitle) {
                headerTitle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (!albumPanel.classList.contains('open')) {
                        populateAlbumPanel();
                    }
                    albumPanel.classList.toggle('open');
                    headerChevron.innerHTML = albumPanel.classList.contains('open') ? '&#9652;' : '&#9662;';
                });
            }

            // Close album panel on click outside
            document.addEventListener('click', function(e) {
                if (albumPanel.classList.contains('open') &&
                    !albumPanel.contains(e.target) &&
                    e.target !== headerTitle &&
                    !headerTitle.contains(e.target)) {
                    albumPanel.classList.remove('open');
                    headerChevron.innerHTML = '&#9662;';
                }
            });

            // --- Track info bar ---
            var trackPanel = document.getElementById('track-info');

            function findTrackData(trackId) {
                var el = document.querySelector('#track-data [data-track-id="' + trackId + '"]');
                if (!el) return null;
                return {
                    title: el.getAttribute('data-title') || '',
                    artist: el.getAttribute('data-artist') || '',
                    description: el.getAttribute('data-description') || '',
                    artworkUrl: el.getAttribute('data-artwork-url') || '',
                    links: el.getAttribute('data-links') || ''
                };
            }

            // Current track data (for artwork toggle)
            var currentTrackData = null;

            function showTrack(trackId) {
                var data = findTrackData(trackId);
                if (!data) return;
                currentTrackData = data;

                document.getElementById('track-title-text').textContent = data.title;
                var chevron = document.getElementById('track-chevron');
                chevron.innerHTML = '&#9662;';
                chevron.style.display = data.artworkUrl ? '' : 'none';
                document.getElementById('track-info-artist').textContent = data.artist;

                var descEl = document.getElementById('track-info-description');
                descEl.textContent = data.description;
                descEl.style.display = data.description ? '' : 'none';

                // Hide artwork on approach — only shown on click
                var artImg = document.getElementById('track-artwork-img');
                artImg.style.display = 'none';

                var linksEl = document.getElementById('track-info-links');
                linksEl.innerHTML = '';
                if (data.links) {
                    try {
                        JSON.parse(data.links).forEach(function(pair) {
                            if (!Array.isArray(pair) || pair.length < 2) return;
                            var url = pair[1];
                            if (!/^https?:\/\//i.test(url)) return;
                            var li = document.createElement('li');
                            var a = document.createElement('a');
                            a.textContent = pair[0];
                            a.href = url;
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                            li.appendChild(a);
                            linksEl.appendChild(li);
                        });
                    } catch (e) { /* ignore malformed JSON */ }
                }
                linksEl.style.display = linksEl.children.length ? '' : 'none';

                trackPanel.classList.add('open');
            }

            // Toggle track artwork on title click/tap
            var trackTitle = document.getElementById('track-info-title');
            var trackChevron = document.getElementById('track-chevron');
            if (trackTitle) {
                trackTitle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var artImg = document.getElementById('track-artwork-img');
                    if (!currentTrackData || !currentTrackData.artworkUrl) return;
                    if (artImg.style.display === 'none') {
                        artImg.src = currentTrackData.artworkUrl;
                        artImg.style.display = '';
                        trackChevron.innerHTML = '&#9652;';
                    } else {
                        artImg.style.display = 'none';
                        trackChevron.innerHTML = '&#9662;';
                    }
                });
            }

            document.addEventListener('track-select', function(e) {
                showTrack(String(e.detail));
            });

            document.addEventListener('track-hide', function() {
                trackPanel.classList.remove('open');
                currentTrackData = null;
            });

        })();
    </script>
</body>
</html>
