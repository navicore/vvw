[package]
name = "vvw-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "VVW WASM web player - Bevy-based maze exploration with spatial audio"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vvw-game.workspace = true
vvw-core.workspace = true
vvw-light.workspace = true
bevy.workspace = true
ron.workspace = true
serde.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
getrandom.workspace = true

[dependencies.web-sys]
version = "0.3"
features = [
    "AudioContext",
    "AudioContextState",
    "GainNode",
    "StereoPannerNode",
    "AudioDestinationNode",
    "AudioParam",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "MediaElementAudioSourceNode",
    "Document",
    "Element",
    "EventTarget",
    "Window",
    "HtmlElement",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "CssStyleDeclaration",
    "CustomEvent",
    "CustomEventInit",
    "Location",
    "console",
    "HtmlImageElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "ImageBitmap",
    "Blob",
]

[dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
