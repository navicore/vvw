[package]
name = "vvw-deploy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "VVW deploy CLI - assemble and deploy WASM player to Cloudflare Pages"

[[bin]]
name = "vvw-deploy"
path = "src/main.rs"

[dependencies]
vvw-core = { path = "../vvw-core", default-features = false }
clap.workspace = true
anyhow.workspace = true
ron.workspace = true
serde.workspace = true
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
tokio = { version = "1", features = ["rt", "fs", "io-util"] }

[lints]
workspace = true
