[workspace]
resolver = "2"
members = [
    "crates/vvw-audio",
    "crates/vvw-core",
    "crates/vvw-game",
    "crates/vvw-light",
    "crates/vvw-app",
]
default-members = ["crates/vvw-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ed Sweeney <ed@onextent.com>"]
license = "MIT"
repository = "https://github.com/navicore/vvw"
description = "VVW - Visual Virtual World: An audio exploration game"
keywords = ["audio", "game", "bevy", "spatial-audio"]
categories = ["multimedia::audio", "games"]
readme = "README.md"

[workspace.dependencies]
# Internal crates
vvw-audio = { path = "crates/vvw-audio" }
vvw-core = { path = "crates/vvw-core" }
vvw-game = { path = "crates/vvw-game" }
vvw-light = { path = "crates/vvw-light" }

# Core dependencies
bevy = "0.18"
leafwing-input-manager = "0.20"
avian2d = "0.5"
kira = { version = "0.11", default-features = false, features = ["cpal", "wav", "mp3", "ogg", "flac"] }
bevy_egui = "0.39.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Filesystem
dirs = "6.0"

# Game-specific
rand = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"

[profile.dev]
opt-level = 2  # Audio code needs some optimization even in debug

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
