[workspace]
resolver = "2"
members = [
    "crates/vvw-audio",
    "crates/vvw-core",
    "crates/vvw-game",
    "crates/vvw-light",
    "crates/vvw-app",
    "crates/vvw-web",
    "crates/vvw-deploy",
]
default-members = ["crates/vvw-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ed Sweeney <ed@onextent.com>"]
license = "MIT"
repository = "https://github.com/navicore/vvw"
description = "VVW - Visual Virtual World: An audio exploration game"
keywords = ["audio", "game", "bevy", "spatial-audio"]
categories = ["multimedia::audio", "games"]
readme = "README.md"

[workspace.dependencies]
# Internal crates
vvw-audio = { path = "crates/vvw-audio" }
vvw-core = { path = "crates/vvw-core" }
vvw-game = { path = "crates/vvw-game" }
vvw-light = { path = "crates/vvw-light" }

# Core dependencies
# default-features=false excludes bevy_audio (rodio/cpal 0.15) — we use kira directly.
# Features expand bevy's "2d" and "ui" presets but omit "audio" everywhere.
# bevy's "2d" = default_app + default_platform + 2d_bevy_render + ui + scene + audio + picking
# bevy's "ui" = default_app + default_platform + ui_api + ui_bevy_render + scene + audio + picking
# We replace "2d" and "ui" with their sub-features, dropping "audio".
bevy = { version = "0.18", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
] }
# Must match the glam version re-exported by bevy; verify with `cargo tree -p glam`
glam = "0.30"
leafwing-input-manager = "0.20"
avian2d = "0.5"
kira = { version = "0.11", default-features = false, features = ["cpal", "wav", "mp3", "ogg", "flac"] }
bevy_egui = "0.39.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Filesystem
dirs = "6.0"

# Game-specific
rand = "0.8"

# WASM / web
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"

[profile.dev]
opt-level = 2  # Audio code needs some optimization even in debug

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
