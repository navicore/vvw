name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a Rust/Bevy game with spatial audio.

            Focus on:
            - Correctness: logic errors, off-by-one, resource leaks, unsound unsafe
            - Bevy ECS patterns: system ordering, query conflicts, deferred command pitfalls, component access
            - Audio: Web Audio API integration, spatial panning math, volume interpolation
            - Performance: per-frame allocations, unnecessary clones, query efficiency
            - Concurrency: non-send resources, system parallelism conflicts
            - Security: file path handling, no panics on untrusted input

            Do NOT flag:
            - Style nits or formatting (clippy pedantic handles this)
            - Missing documentation or comments
            - Naming preferences

            Use the repository's CLAUDE.md for project conventions. Only report issues you are confident about. Be specific — cite file paths and line numbers.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
